<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS Guest</title><style>html,body{margin:0;height:100%;font-family:system-ui;background:#05070b;color:#fff}body{display:grid;place-items:center}.s{opacity:.72;font-size:14px}</style></head><body><div class="s">Chargement de NEXUS…</div><script>(async()=>{try{const b64=(await (await fetch('/g5r1_payload.b64',{cache:'no-store'})).text()).trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="white-space:pre-wrap;padding:24px">NEXUS G5R1 — erreur de chargement\n'+String(e)+'</pre>'}})();</script></body></html>
