name: NEXUS V005 C002 PROVIDER RUN RESUME SESSION OWNERSHIP 021 - Build APK

on:
  push:
    branches:
      - v005-c002-provider-run-resume-session-ownership-021
    paths:
      - 'providerresume021/**'
      - 'claudesubmissionproof020/**'
      - 'rotationrunstate019/**'
      - 'providercomposersync018/**'
      - 'claudeturngeneration017/**'
      - 'branding/**'
      - '.github/workflows/build-provider-run-resume021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Validate frozen C002
        shell: bash
        run: |
          set -euo pipefail
          echo '26b5b157b487eda3a0c92198066d39beb5e6eb1149a3c4a705b49274c636eed4  V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip' | sha256sum -c -
          mkdir base
          unzip -q V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d base
          cd base/V005_ANDROID_CHROMIUM_WEBVIEW_C002
          chmod +x run_validation.sh run_core_tests.sh
          ./run_validation.sh | tee /tmp/C002_VALIDATION.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/C002_VALIDATION.txt
          grep -F 'STATIC_RESULT pass=10 fail=0' /tmp/C002_VALIDATION.txt

      - name: Reconstruct and validate 020 reference
        shell: bash
        run: |
          set -euo pipefail
          python3 claudesubmissionproof020/derive.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/reference020/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          chmod +x claudesubmissionproof020/run_validation.sh
          claudesubmissionproof020/run_validation.sh "$GITHUB_WORKSPACE/reference020/V005_ANDROID_CHROMIUM_WEBVIEW_C002" "$GITHUB_WORKSPACE/reference019/V005_ANDROID_CHROMIUM_WEBVIEW_C002" 2>/dev/null || true
          node --check "$GITHUB_WORKSPACE/reference020/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/src/main/assets/nexus/claude_provider_c002.js"

      - name: Derive 021 with branding postcondition
        shell: bash
        run: |
          set -euo pipefail
          python3 providerresume021/derive_canonical.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

      - name: Apply canonical NEXUS launcher branding
        uses: mobilexiaoben-byte/nexus-v005-android-c002/branding@main
        with:
          root: ${{ github.workspace }}/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Validate 021 derivative
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          REF="$GITHUB_WORKSPACE/reference020/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          chmod +x "$ROOT/run_core_tests.sh" providerresume021/run_validation.sh
          "$ROOT/run_core_tests.sh" | tee /tmp/RESUME021_CORE.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/RESUME021_CORE.txt
          providerresume021/run_validation.sh "$ROOT" "$REF" | tee /tmp/RESUME021_VALIDATION.txt
          grep -F 'PROVIDER_RUN_RESUME_SESSION_OWNERSHIP_021_STATIC_RESULT pass=37 fail=0' /tmp/RESUME021_VALIDATION.txt

      - name: Verify Android official launcher source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          MANIFEST="$ROOT/app/src/main/AndroidManifest.xml"
          FG="$ROOT/app/src/main/res/drawable/nexus_launcher_foreground.xml"
          ADAPT="$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          ROUND="$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"

          grep -F 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"
          grep -F 'android:roundIcon="@mipmap/ic_launcher_round"' "$MANIFEST"
          test -f "$FG"
          test -f "$ADAPT"
          test -f "$ROUND"
          grep -F 'android:width="108dp"' "$FG"
          grep -F 'android:height="108dp"' "$FG"
          grep -F 'android:viewportWidth="108"' "$FG"
          grep -F 'android:viewportHeight="108"' "$FG"
          grep -F 'M54,26.195' "$FG"
          grep -F 'M34.976,67.171' "$FG"
          grep -F 'M73.024,67.171' "$FG"
          grep -F 'android:strokeWidth="4.39"' "$FG"
          ! grep -Fq 'android:scaleX=' "$FG"
          ! grep -Fq 'android:scaleY=' "$FG"

          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import struct, sys
          root = Path(sys.argv[1])
          expected = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density, size in expected.items():
              for name in ('ic_launcher.png','ic_launcher_round.png'):
                  p = root / 'app/src/main/res' / f'mipmap-{density}' / name
                  data = p.read_bytes()
                  assert data.startswith(b'\x89PNG\r\n\x1a\n')
                  assert struct.unpack('>II', data[16:24]) == (size, size)
          print('NEXUS_LAUNCHER_CANONICAL_V5_ANDROID_OFFICIAL_SAFE60=PASS')
          PY

      - name: Build APK
        working-directory: work/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify canonical NEXUS launcher in built APK
        uses: mobilexiaoben-byte/nexus-v005-android-c002/branding/verify-apk@main
        with:
          apk: ${{ github.workspace }}/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/build/outputs/apk/debug/app-debug.apk
          expected_package: nexus.android.c002.providerrunresume021

      - name: Capture 021 launcher evidence
        shell: bash
        run: |
          cp /tmp/NEXUS_CANONICAL_LAUNCHER_BADGING.txt /tmp/RESUME021_BADGING.txt
          cp /tmp/NEXUS_CANONICAL_ADAPTIVE_XMLTREE.txt /tmp/RESUME021_ADAPTIVE_XMLTREE.txt
          cp /tmp/NEXUS_CANONICAL_FOREGROUND_XMLTREE.txt /tmp/RESUME021_FOREGROUND_XMLTREE.txt

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          ROOT='work/V005_ANDROID_CHROMIUM_WEBVIEW_C002'
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" NEXUS-V005-C002-PROVIDER-RUN-RESUME-SESSION-OWNERSHIP-021-debug.apk
          sha256sum NEXUS-V005-C002-PROVIDER-RUN-RESUME-SESSION-OWNERSHIP-021-debug.apk > NEXUS-V005-C002-PROVIDER-RUN-RESUME-SESSION-OWNERSHIP-021-debug.apk.sha256
          (cd work && zip -qr ../V005_ANDROID_CHROMIUM_WEBVIEW_C002_PROVIDER_RUN_RESUME_SESSION_OWNERSHIP_021.zip V005_ANDROID_CHROMIUM_WEBVIEW_C002)
          sha256sum V005_ANDROID_CHROMIUM_WEBVIEW_C002_PROVIDER_RUN_RESUME_SESSION_OWNERSHIP_021.zip > V005_ANDROID_CHROMIUM_WEBVIEW_C002_PROVIDER_RUN_RESUME_SESSION_OWNERSHIP_021.zip.sha256
          cp /tmp/C002_VALIDATION.txt .
          cp /tmp/RESUME021_CORE.txt .
          cp /tmp/RESUME021_VALIDATION.txt .
          cp /tmp/RESUME021_BADGING.txt .
          cp /tmp/RESUME021_ADAPTIVE_XMLTREE.txt .
          cp /tmp/RESUME021_FOREGROUND_XMLTREE.txt .
          sha256sum "$ROOT/app/src/main/AndroidManifest.xml" "$ROOT/app/src/main/res/drawable/nexus_launcher_foreground.xml" "$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" "$ROOT/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" "$ROOT/app/src/main/java/nexus/android/c002/MainActivity.kt" "$ROOT/app/src/main/assets/nexus/chatgpt_provider_c002.js" "$ROOT/app/src/main/assets/nexus/claude_provider_c002.js" "$ROOT/app/src/main/java/nexus/android/c002/web/OriginPolicy.kt" "$ROOT/app/src/main/java/nexus/android/c002/web/NexusWebBridge.kt" > RESUME021_SOURCE_SHA256.txt

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-PROVIDER-RUN-RESUME-SESSION-OWNERSHIP-021-debug
          path: NEXUS-V005-C002-PROVIDER-RUN-RESUME-SESSION-OWNERSHIP-021-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-PROVIDER-RUN-RESUME-SESSION-OWNERSHIP-021-source
          path: V005_ANDROID_CHROMIUM_WEBVIEW_C002_PROVIDER_RUN_RESUME_SESSION_OWNERSHIP_021.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-PROVIDER-RUN-RESUME-SESSION-OWNERSHIP-021-evidence
          path: |
            NEXUS-V005-C002-PROVIDER-RUN-RESUME-SESSION-OWNERSHIP-021-debug.apk.sha256
            V005_ANDROID_CHROMIUM_WEBVIEW_C002_PROVIDER_RUN_RESUME_SESSION_OWNERSHIP_021.zip.sha256
            RESUME021_SOURCE_SHA256.txt
            C002_VALIDATION.txt
            RESUME021_CORE.txt
            RESUME021_VALIDATION.txt
            RESUME021_BADGING.txt
            RESUME021_ADAPTIVE_XMLTREE.txt
            RESUME021_FOREGROUND_XMLTREE.txt
          if-no-files-found: error
