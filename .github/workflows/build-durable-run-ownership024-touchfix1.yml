name: NEXUS V005 C002 DURABLE RUN OWNERSHIP 024 TOUCHFIX1 - Build APK

on:
  push:
    branches:
      - v005-c002-durable-run-ownership-024-touchfix1
    paths:
      - 'durablerunownership024/**'
      - 'runresumeevidence023/**'
      - 'providerresumediag022/**'
      - 'providerresume021/**'
      - 'claudesubmissionproof020/**'
      - 'rotationrunstate019/**'
      - 'providercomposersync018/**'
      - 'claudeturngeneration017/**'
      - 'branding/**'
      - '.github/workflows/build-durable-run-ownership024-touchfix1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Validate frozen C002
        shell: bash
        run: |
          set -euo pipefail
          echo '26b5b157b487eda3a0c92198066d39beb5e6eb1149a3c4a705b49274c636eed4  V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip' | sha256sum -c -
          mkdir base
          unzip -q V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d base
          cd base/V005_ANDROID_CHROMIUM_WEBVIEW_C002
          chmod +x run_validation.sh run_core_tests.sh
          ./run_validation.sh | tee /tmp/C002_VALIDATION.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/C002_VALIDATION.txt
          grep -F 'STATIC_RESULT pass=10 fail=0' /tmp/C002_VALIDATION.txt

      - name: Reconstruct 023 reference
        shell: bash
        run: |
          set -euo pipefail
          python3 runresumeevidence023/derive.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/reference023/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          node --check "$GITHUB_WORKSPACE/reference023/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/src/main/assets/nexus/claude_provider_c002.js"

      - name: Derive baseline 024
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          python3 durablerunownership024/derive.py "$GITHUB_WORKSPACE" "$ROOT"
          python3 durablerunownership024/fix_renderer.py "$ROOT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Validate baseline 024 invariants
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          REF="$GITHUB_WORKSPACE/reference023/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          chmod +x "$ROOT/run_core_tests.sh" durablerunownership024/run_validation.sh
          "$ROOT/run_core_tests.sh" | tee /tmp/DURABLERUN024_CORE_BASE.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/DURABLERUN024_CORE_BASE.txt
          durablerunownership024/run_validation.sh "$ROOT" "$REF" | tee /tmp/DURABLERUN024_VALIDATION_BASE.txt
          grep -F 'DURABLE_RUN_OWNERSHIP_024_STATIC_RESULT pass=35 fail=0' /tmp/DURABLERUN024_VALIDATION_BASE.txt

      - name: Apply TOUCHFIX1
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          python3 durablerunownership024/touchfix1.py "$ROOT"

      - name: Validate TOUCHFIX1
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          chmod +x "$ROOT/run_core_tests.sh" durablerunownership024/touchfix1_validation.sh
          "$ROOT/run_core_tests.sh" | tee /tmp/DURABLERUN024_TOUCHFIX1_CORE.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/DURABLERUN024_TOUCHFIX1_CORE.txt
          durablerunownership024/touchfix1_validation.sh "$ROOT" | tee /tmp/DURABLERUN024_TOUCHFIX1_VALIDATION.txt
          grep -F 'DURABLE_RUN_OWNERSHIP_024_TOUCHFIX1_STATIC_RESULT pass=21 fail=0' /tmp/DURABLERUN024_TOUCHFIX1_VALIDATION.txt

      - name: Verify NEXUS launcher source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          grep -F 'android:icon="@mipmap/ic_launcher"' "$ROOT/app/src/main/AndroidManifest.xml"
          grep -F 'android:roundIcon="@mipmap/ic_launcher_round"' "$ROOT/app/src/main/AndroidManifest.xml"
          test -f "$ROOT/app/src/main/res/drawable/nexus_launcher_foreground.xml"

      - name: Build APK
        working-directory: work/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -f "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/DURABLERUN024_TOUCHFIX1_BADGING.txt
          grep -F "package: name='nexus.android.c002.durablerunownership024touchfix1'" /tmp/DURABLERUN024_TOUCHFIX1_BADGING.txt
          grep -F "versionCode='26'" /tmp/DURABLERUN024_TOUCHFIX1_BADGING.txt
          grep -E "application:.*icon='res/mipmap" /tmp/DURABLERUN024_TOUCHFIX1_BADGING.txt

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          ROOT='work/V005_ANDROID_CHROMIUM_WEBVIEW_C002'
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" NEXUS-V005-C002-DURABLE-RUN-OWNERSHIP-024-TOUCHFIX1-debug.apk
          sha256sum NEXUS-V005-C002-DURABLE-RUN-OWNERSHIP-024-TOUCHFIX1-debug.apk > NEXUS-V005-C002-DURABLE-RUN-OWNERSHIP-024-TOUCHFIX1-debug.apk.sha256
          (cd work && zip -qr ../V005_ANDROID_CHROMIUM_WEBVIEW_C002_DURABLE_RUN_OWNERSHIP_024_TOUCHFIX1.zip V005_ANDROID_CHROMIUM_WEBVIEW_C002)
          sha256sum V005_ANDROID_CHROMIUM_WEBVIEW_C002_DURABLE_RUN_OWNERSHIP_024_TOUCHFIX1.zip > V005_ANDROID_CHROMIUM_WEBVIEW_C002_DURABLE_RUN_OWNERSHIP_024_TOUCHFIX1.zip.sha256
          cp /tmp/C002_VALIDATION.txt .
          cp /tmp/DURABLERUN024_CORE_BASE.txt .
          cp /tmp/DURABLERUN024_VALIDATION_BASE.txt .
          cp /tmp/DURABLERUN024_TOUCHFIX1_CORE.txt .
          cp /tmp/DURABLERUN024_TOUCHFIX1_VALIDATION.txt .
          cp /tmp/DURABLERUN024_TOUCHFIX1_BADGING.txt .
          sha256sum "$ROOT/app/src/main/AndroidManifest.xml" "$ROOT/app/src/main/res/layout/activity_main.xml" "$ROOT/app/src/main/java/nexus/android/c002/MainActivity.kt" "$ROOT/app/src/main/assets/nexus/chatgpt_provider_c002.js" "$ROOT/app/src/main/assets/nexus/claude_provider_c002.js" "$ROOT/app/src/main/java/nexus/android/c002/web/OriginPolicy.kt" "$ROOT/app/src/main/java/nexus/android/c002/web/NexusWebBridge.kt" > DURABLERUN024_TOUCHFIX1_SOURCE_SHA256.txt

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-DURABLE-RUN-OWNERSHIP-024-TOUCHFIX1-debug
          path: NEXUS-V005-C002-DURABLE-RUN-OWNERSHIP-024-TOUCHFIX1-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-DURABLE-RUN-OWNERSHIP-024-TOUCHFIX1-source
          path: V005_ANDROID_CHROMIUM_WEBVIEW_C002_DURABLE_RUN_OWNERSHIP_024_TOUCHFIX1.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-DURABLE-RUN-OWNERSHIP-024-TOUCHFIX1-evidence
          path: |
            NEXUS-V005-C002-DURABLE-RUN-OWNERSHIP-024-TOUCHFIX1-debug.apk.sha256
            V005_ANDROID_CHROMIUM_WEBVIEW_C002_DURABLE_RUN_OWNERSHIP_024_TOUCHFIX1.zip.sha256
            DURABLERUN024_TOUCHFIX1_SOURCE_SHA256.txt
            C002_VALIDATION.txt
            DURABLERUN024_CORE_BASE.txt
            DURABLERUN024_VALIDATION_BASE.txt
            DURABLERUN024_TOUCHFIX1_CORE.txt
            DURABLERUN024_TOUCHFIX1_VALIDATION.txt
            DURABLERUN024_TOUCHFIX1_BADGING.txt
          if-no-files-found: error
