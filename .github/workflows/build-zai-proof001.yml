name: NEXUS V005 ZAI ANDROID PROOF 001 - Build APK

on:
  push:
    branches: [v005-zai-android-proof001]
    paths: ['.github/workflows/build-zai-proof001.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Validate frozen C002 baseline
        shell: bash
        run: |
          set -euo pipefail
          echo '26b5b157b487eda3a0c92198066d39beb5e6eb1149a3c4a705b49274c636eed4  V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip' | sha256sum -c -
          mkdir base
          unzip -q V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d base
          ROOT="$GITHUB_WORKSPACE/base/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          cd "$ROOT"
          chmod +x run_validation.sh run_core_tests.sh
          ./run_validation.sh | tee /tmp/C002_VALIDATION.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/C002_VALIDATION.txt
          grep -F 'STATIC_RESULT pass=10 fail=0' /tmp/C002_VALIDATION.txt

      - name: Derive Z.ai Android proof
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          python3 zaiproof001/derive.py "$GITHUB_WORKSPACE" "$ROOT"
          sha256sum \
            "$ROOT/app/src/main/java/nexus/android/c002/MainActivity.kt" \
            "$ROOT/app/src/main/java/nexus/android/c002/core/TransportContract.kt" \
            "$ROOT/app/src/main/java/nexus/android/c002/web/NexusWebBridge.kt" \
            "$ROOT/app/src/main/java/nexus/android/c002/web/OriginPolicy.kt" \
            "$ROOT/app/src/main/assets/nexus/zai_provider_c002.js" \
            "$ROOT/app/src/main/assets/nexus/gemini_provider_c002.js" \
            "$ROOT/app/src/main/assets/nexus/chatgpt_provider_c002.js" \
            "$ROOT/app/src/main/assets/nexus/claude_provider_c002.js" \
            > /tmp/ZAI_PROOF001_SOURCE_SHA256.txt

      - name: Validate Z.ai derivative
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          bash zaiproof001/run_validation.sh "$ROOT" | tee /tmp/ZAI_PROOF001_VALIDATION.txt
          grep -E '^ZAI_PROOF001_STATIC_RESULT pass=[0-9]+ fail=0$' /tmp/ZAI_PROOF001_VALIDATION.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Apply NEXUS icon
        uses: mobilexiaoben-byte/nexus-v005-android-c002/branding@main
        with:
          root: ${{ github.workspace }}/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002

      - name: Build APK
        working-directory: work/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate APK badging
        shell: bash
        run: |
          set -euo pipefail
          APK='work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/ZAI_PROOF001_BADGING.txt
          grep -F "package: name='nexus.android.c002.zaiexecutionproof001'" /tmp/ZAI_PROOF001_BADGING.txt
          grep -F "application-label:'NEXUS ZAI ANDROID PROOF 001'" /tmp/ZAI_PROOF001_BADGING.txt

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK_OUT='NEXUS-V005-ZAI-ANDROID-PROOF-001-debug.apk'
          cp work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/build/outputs/apk/debug/app-debug.apk "$APK_OUT"
          sha256sum "$APK_OUT" > "$APK_OUT.sha256"
          cp /tmp/C002_VALIDATION.txt .
          cp /tmp/ZAI_PROOF001_VALIDATION.txt .
          cp /tmp/ZAI_PROOF001_SOURCE_SHA256.txt .
          cp /tmp/ZAI_PROOF001_BADGING.txt .
          (cd work && zip -qr ../V005_ZAI_ANDROID_PROOF_001_SOURCE.zip V005_ANDROID_CHROMIUM_WEBVIEW_C002)
          sha256sum V005_ZAI_ANDROID_PROOF_001_SOURCE.zip > V005_ZAI_ANDROID_PROOF_001_SOURCE.zip.sha256
          cat "$APK_OUT.sha256"
          cat V005_ZAI_ANDROID_PROOF_001_SOURCE.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-ZAI-ANDROID-PROOF-001-debug
          path: NEXUS-V005-ZAI-ANDROID-PROOF-001-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-ZAI-ANDROID-PROOF-001-source
          path: V005_ZAI_ANDROID_PROOF_001_SOURCE.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-ZAI-ANDROID-PROOF-001-evidence
          path: |
            NEXUS-V005-ZAI-ANDROID-PROOF-001-debug.apk.sha256
            V005_ZAI_ANDROID_PROOF_001_SOURCE.zip.sha256
            C002_VALIDATION.txt
            ZAI_PROOF001_VALIDATION.txt
            ZAI_PROOF001_SOURCE_SHA256.txt
            ZAI_PROOF001_BADGING.txt
          if-no-files-found: error
