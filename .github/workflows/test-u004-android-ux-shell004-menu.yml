name: NEXUS U004 - UX Shell 004 Menu Instrumentation

on:
  push:
    branches: [u004-android-ux-shell-004-content]
    paths:
      - 'u004ux004/inject_menu_instrumentation.py'
      - '.github/workflows/test-u004-android-ux-shell004-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  menu-instrumentation:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Validate frozen C002 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip')
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          expected='26b5b157b487eda3a0c92198066d39beb5e6eb1149a3c4a705b49274c636eed4'
          assert got == expected, (got, expected)
          print('FROZEN_C002_SHA256_PASS')
          PY

      - name: Derive exact U004 SHELL 004 candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p base work
          unzip -q V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d base
          python3 u004ux004/derive.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          python3 u004ux004/inject_menu_instrumentation.py "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Run menu instrumentation on accelerated Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle -p "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002" :app:connectedDebugAndroidTest --stacktrace --no-daemon > "$GITHUB_WORKSPACE/U004_MENU_INSTRUMENTATION.txt" 2>&1; rc=$?; echo "$rc" > "$GITHUB_WORKSPACE/U004_MENU_RC.txt"; cat "$GITHUB_WORKSPACE/U004_MENU_INSTRUMENTATION.txt"; find "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/build/outputs/androidTest-results" -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null || true; exit 0

      - name: Persist instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: NEXUS-U004-SHELL004-menu-instrumentation-evidence
          path: |
            U004_MENU_INSTRUMENTATION.txt
            U004_MENU_RC.txt
            work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/build/outputs/androidTest-results/**
            work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/build/reports/androidTests/connected/debug/**
          if-no-files-found: warn

      - name: Assert menu flow PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat U004_MENU_RC.txt)" = "0"
          grep -F 'BUILD SUCCESSFUL' U004_MENU_INSTRUMENTATION.txt
          ! grep -E 'FAILURES!!!|FAILED|There were failing tests' U004_MENU_INSTRUMENTATION.txt
          echo 'U004_MENU_FLOW_PASS: provider_response -> nexus_result -> technical_details'
