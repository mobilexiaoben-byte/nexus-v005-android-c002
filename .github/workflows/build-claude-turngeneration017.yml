name: NEXUS V005 C002 CLAUDE TURN GENERATION DIAGNOSTIC 017 - Build APK

on:
  push:
    branches:
      - v005-c002-claude-turn-generation-diagnostic-017
    paths:
      - 'claudeturngeneration017/**'
      - 'branding/**'
      - '.github/workflows/build-claude-turngeneration017.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Validate frozen C002
        shell: bash
        run: |
          set -euo pipefail
          echo '26b5b157b487eda3a0c92198066d39beb5e6eb1149a3c4a705b49274c636eed4  V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip' | sha256sum -c -
          mkdir base
          unzip -q V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d base
          cd base/V005_ANDROID_CHROMIUM_WEBVIEW_C002
          chmod +x run_validation.sh run_core_tests.sh
          ./run_validation.sh | tee /tmp/C002_VALIDATION.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/C002_VALIDATION.txt
          grep -F 'STATIC_RESULT pass=10 fail=0' /tmp/C002_VALIDATION.txt

      - name: Reconstruct and validate 016 reference
        shell: bash
        run: |
          set -euo pipefail
          python3 clauderesultdomdiag015/derive.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/reference015/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          python3 claudeprompthardening016/derive.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/reference016/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          chmod +x claudeprompthardening016/run_validation.sh
          claudeprompthardening016/run_validation.sh \
            "$GITHUB_WORKSPACE/reference016/V005_ANDROID_CHROMIUM_WEBVIEW_C002" \
            "$GITHUB_WORKSPACE/reference015/V005_ANDROID_CHROMIUM_WEBVIEW_C002" | tee /tmp/CLAUDE016_VALIDATION.txt
          grep -F 'fail=0' /tmp/CLAUDE016_VALIDATION.txt

      - name: Derive Claude turn generation diagnostic 017
        shell: bash
        run: |
          set -euo pipefail
          python3 claudeturngeneration017/derive.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Validate derivative
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          REF="$GITHUB_WORKSPACE/reference016/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          chmod +x "$ROOT/run_core_tests.sh" claudeturngeneration017/run_validation.sh
          "$ROOT/run_core_tests.sh" | tee /tmp/CLAUDE017_CORE.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/CLAUDE017_CORE.txt
          claudeturngeneration017/run_validation.sh "$ROOT" "$REF" | tee /tmp/CLAUDE017_VALIDATION.txt
          grep -F 'CLAUDE_TURN_GENERATION_DIAGNOSTIC_017_STATIC_RESULT' /tmp/CLAUDE017_VALIDATION.txt
          grep -F 'fail=0' /tmp/CLAUDE017_VALIDATION.txt

      - name: Verify inherited NEXUS launcher source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          grep -F 'android:icon="@mipmap/ic_launcher"' "$ROOT/app/src/main/AndroidManifest.xml"
          grep -F 'android:roundIcon="@mipmap/ic_launcher_round"' "$ROOT/app/src/main/AndroidManifest.xml"
          test -f "$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          test -f "$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"
          FOREGROUND="$ROOT/app/src/main/res/drawable/nexus_launcher_foreground.xml"
          test -f "$FOREGROUND"
          grep -F 'M54,33.5' "$FOREGROUND"
          grep -F 'M41,61.5' "$FOREGROUND"
          if grep -q 'android:scaleX=' "$FOREGROUND"; then
            echo 'ERROR: launcher must use direct compact coordinates, not group scaling'
            exit 1
          fi

      - name: Build APK
        working-directory: work/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify NEXUS launcher in built APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -f "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/CLAUDE017_BADGING.txt
          grep -E "application:.*icon='res/mipmap" /tmp/CLAUDE017_BADGING.txt
          unzip -l "$APK" | grep -E 'res/mipmap-anydpi-v26/ic_launcher(_round)?\.xml|res/drawable/nexus_launcher_foreground\.xml' | tee /tmp/CLAUDE017_ICON_FILES.txt
          test "$(wc -l < /tmp/CLAUDE017_ICON_FILES.txt)" -ge 3

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          ROOT='work/V005_ANDROID_CHROMIUM_WEBVIEW_C002'
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" NEXUS-V005-C002-CLAUDE-TURN-GENERATION-DIAGNOSTIC-017-debug.apk
          sha256sum NEXUS-V005-C002-CLAUDE-TURN-GENERATION-DIAGNOSTIC-017-debug.apk > NEXUS-V005-C002-CLAUDE-TURN-GENERATION-DIAGNOSTIC-017-debug.apk.sha256
          (cd work && zip -qr ../V005_ANDROID_CHROMIUM_WEBVIEW_C002_CLAUDE_TURN_GENERATION_DIAGNOSTIC_017.zip V005_ANDROID_CHROMIUM_WEBVIEW_C002)
          sha256sum V005_ANDROID_CHROMIUM_WEBVIEW_C002_CLAUDE_TURN_GENERATION_DIAGNOSTIC_017.zip > V005_ANDROID_CHROMIUM_WEBVIEW_C002_CLAUDE_TURN_GENERATION_DIAGNOSTIC_017.zip.sha256
          cp /tmp/C002_VALIDATION.txt .
          cp /tmp/CLAUDE016_VALIDATION.txt .
          cp /tmp/CLAUDE017_CORE.txt .
          cp /tmp/CLAUDE017_VALIDATION.txt .
          cp /tmp/CLAUDE017_BADGING.txt .
          cp /tmp/CLAUDE017_ICON_FILES.txt .
          sha256sum \
            "$ROOT/app/src/main/java/nexus/android/c002/MainActivity.kt" \
            "$ROOT/app/src/main/assets/nexus/chatgpt_provider_c002.js" \
            "$ROOT/app/src/main/assets/nexus/claude_provider_c002.js" \
            "$ROOT/app/src/main/java/nexus/android/c002/web/OriginPolicy.kt" \
            "$ROOT/app/src/main/java/nexus/android/c002/web/NexusWebBridge.kt" \
            > CLAUDE017_SOURCE_SHA256.txt

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-CLAUDE-TURN-GENERATION-DIAGNOSTIC-017-debug
          path: NEXUS-V005-C002-CLAUDE-TURN-GENERATION-DIAGNOSTIC-017-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-CLAUDE-TURN-GENERATION-DIAGNOSTIC-017-source
          path: V005_ANDROID_CHROMIUM_WEBVIEW_C002_CLAUDE_TURN_GENERATION_DIAGNOSTIC_017.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-CLAUDE-TURN-GENERATION-DIAGNOSTIC-017-evidence
          path: |
            NEXUS-V005-C002-CLAUDE-TURN-GENERATION-DIAGNOSTIC-017-debug.apk.sha256
            V005_ANDROID_CHROMIUM_WEBVIEW_C002_CLAUDE_TURN_GENERATION_DIAGNOSTIC_017.zip.sha256
            CLAUDE017_SOURCE_SHA256.txt
            C002_VALIDATION.txt
            CLAUDE016_VALIDATION.txt
            CLAUDE017_CORE.txt
            CLAUDE017_VALIDATION.txt
            CLAUDE017_BADGING.txt
            CLAUDE017_ICON_FILES.txt
          if-no-files-found: error
