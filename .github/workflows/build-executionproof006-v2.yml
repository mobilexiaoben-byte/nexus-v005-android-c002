name: NEXUS V005 C002 EXECUTION PROOF 006 - Build APK V2

on:
  push:
    branches: [v005-executionproof006]
    paths: ['.github/workflows/build-executionproof006-v2.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Validate frozen C002
        shell: bash
        run: |
          set -euo pipefail
          echo '26b5b157b487eda3a0c92198066d39beb5e6eb1149a3c4a705b49274c636eed4  V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip' | sha256sum -c -
          mkdir base
          unzip -q V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d base
          cd base/V005_ANDROID_CHROMIUM_WEBVIEW_C002
          chmod +x run_validation.sh run_core_tests.sh
          ./run_validation.sh | tee /tmp/C002_VALIDATION.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/C002_VALIDATION.txt
          grep -F 'STATIC_RESULT pass=10 fail=0' /tmp/C002_VALIDATION.txt

      - name: Derive proof source
        shell: bash
        run: |
          set -euo pipefail
          cp -a base work
          ROOT='work/V005_ANDROID_CHROMIUM_WEBVIEW_C002'
          cp executionproof006/MainActivity.kt "$ROOT/app/src/main/java/nexus/android/c002/MainActivity.kt"
          cp executionproof006/chatgpt_provider_c002.js "$ROOT/app/src/main/assets/nexus/chatgpt_provider_c002.js"
          cp executionproof006/run_executionproof006_validation.sh "$ROOT/run_executionproof006_validation.sh"
          chmod +x "$ROOT/run_executionproof006_validation.sh"
          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import sys
          r=Path(sys.argv[1])
          p=r/'app/build.gradle.kts'; s=p.read_text(); s=s.replace('applicationId = "nexus.android.c002"','applicationId = "nexus.android.c002.executionproof006"').replace('versionCode = 2','versionCode = 7').replace('versionName = "0.0.2-c002"','versionName = "0.0.7-c002-executionproof006"'); p.write_text(s)
          p=r/'app/src/main/AndroidManifest.xml'; s=p.read_text();
          if 'android:label="NEXUS Android C002"' not in s: raise SystemExit('manifest label baseline mismatch')
          p.write_text(s.replace('android:label="NEXUS Android C002"','android:label="NEXUS C002 EXECUTION PROOF 006"'))
          p=r/'app/src/main/res/layout/activity_main.xml'; s=p.read_text(); needle='android:padding="12dp"\n        android:text="NEXUS C002 — initializing"'; repl='android:padding="8dp"\n        android:maxLines="2"\n        android:ellipsize="end"\n        android:clickable="true"\n        android:focusable="true"\n        android:text="EXECUTION PROOF 006 — initializing"';
          if needle not in s: raise SystemExit('layout baseline mismatch')
          p.write_text(s.replace(needle,repl))
          p=r/'app/src/main/java/nexus/android/c002/web/OriginPolicy.kt'; s=p.read_text(); needle='            host == "anthropic.com" || host.endsWith(".anthropic.com")\n'; repl='            host == "anthropic.com" || host.endsWith(".anthropic.com") ||\n            host == "accounts.google.com" ||\n            host == "accounts.youtube.com"\n';
          if s.count(needle)!=1: raise SystemExit('policy baseline mismatch')
          p.write_text(s.replace(needle,repl))
          PY
          test "$(sha256sum "$ROOT/app/src/main/java/nexus/android/c002/web/OriginPolicy.kt" | cut -d' ' -f1)" = '80241cf1581bdac6e87f602d300acebef5785f93e9bb570de4925b99118b76b3'
          sha256sum "$ROOT/app/src/main/java/nexus/android/c002/MainActivity.kt" "$ROOT/app/src/main/assets/nexus/chatgpt_provider_c002.js" "$ROOT/app/src/main/java/nexus/android/c002/web/OriginPolicy.kt" > /tmp/EXEC006_SOURCE_SHA256.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Validate derivative
        working-directory: work/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        shell: bash
        run: |
          set -euo pipefail
          ./run_core_tests.sh | tee /tmp/EXEC006_CORE.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/EXEC006_CORE.txt
          ./run_executionproof006_validation.sh | tee /tmp/EXEC006_VALIDATION.txt
          grep -F 'EXECUTION_PROOF_006_STATIC_RESULT pass=44 fail=0' /tmp/EXEC006_VALIDATION.txt

      - name: Build APK
        working-directory: work/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/build/outputs/apk/debug/app-debug.apk NEXUS-V005-C002-EXECUTION-PROOF-006-debug.apk
          sha256sum NEXUS-V005-C002-EXECUTION-PROOF-006-debug.apk > NEXUS-V005-C002-EXECUTION-PROOF-006-debug.apk.sha256
          cp /tmp/EXEC006_SOURCE_SHA256.txt .
          cp /tmp/C002_VALIDATION.txt .
          cp /tmp/EXEC006_VALIDATION.txt .
          cat NEXUS-V005-C002-EXECUTION-PROOF-006-debug.apk.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-EXECUTION-PROOF-006-debug
          path: NEXUS-V005-C002-EXECUTION-PROOF-006-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-EXECUTION-PROOF-006-evidence
          path: |
            NEXUS-V005-C002-EXECUTION-PROOF-006-debug.apk.sha256
            EXEC006_SOURCE_SHA256.txt
            C002_VALIDATION.txt
            EXEC006_VALIDATION.txt
          if-no-files-found: error
