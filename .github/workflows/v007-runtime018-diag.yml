name: V007 RUNTIME018 DIAG PROVIDERS
on:
  push:
    branches: [v007-m024-u013-provider-runtime-018-provider-regression-fix]
    paths: ['.github/workflows/v007-runtime018-diag.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Generate Runtime017 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf base work
          mkdir -p base work
          unzip -q V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d base
          cp -a base/V005_ANDROID_CHROMIUM_WEBVIEW_C002 work/
          python3 u013ux009/derive.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          python3 reconcile001/apply_reconcile.py "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          python3 reconcile017/provider_runtime_017.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
      - name: Inspect provider status and UI state
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          MAIN="$ROOT/app/src/main/java/nexus/android/c002/MainActivity.kt"
          grep -nEi -C 12 'GEMINI_STATUS|ZAI_STATUS|handleProviderStatus|bridgeStatus|currentHeadline|DESCRIBE_PASS|BLOCKED|ACTIVE_HEADLINE|selectedProviderOrigin|providerConfirmedByUser' "$MAIN" || true
          echo '=== GEMINI SELECTORS ==='
          grep -nEi -C 4 'querySelector|findComposer|send|responseNodes|generating' "$ROOT/app/src/main/assets/nexus/gemini_provider_c002.js" || true
