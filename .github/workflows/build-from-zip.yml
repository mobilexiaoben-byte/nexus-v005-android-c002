name: NEXUS V005 C003 - Build APK from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned OPA
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo opa https://openpolicyagent.org/downloads/v1.20.2/opa_linux_amd64_static
          echo "69da5179ee403d10fa11bab6cfb4ffb0d23dba5f9b682fa977db772a1da5670f  opa" | sha256sum -c -
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: NEXUS governance preflight
        shell: bash
        run: python3 governance/golden_guard.py --manifest governance/preflight/build-from-zip.json

      - name: NEXUS OPA dual enforcement
        shell: bash
        run: python3 governance/opa/dual_guard.py --manifest governance/preflight/build-from-zip.json

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Extract NEXUS C003
        shell: bash
        run: |
          set -euo pipefail
          echo '69f88ce310515d94c7225a080d615c64c7bc3dac786cc2a9d590901599fa6670  V005_ANDROID_CHROMIUM_WEBVIEW_C003.zip' | sha256sum -c -
          test -f V005_ANDROID_CHROMIUM_WEBVIEW_C003.zip
          mkdir extracted
          unzip -q V005_ANDROID_CHROMIUM_WEBVIEW_C003.zip -d extracted
          test -f extracted/V005_ANDROID_CHROMIUM_WEBVIEW_C002/settings.gradle.kts

      - name: Apply canonical NEXUS launcher branding
        uses: mobilexiaoben-byte/nexus-v005-android-c002/branding@main
        with:
          root: ${{ github.workspace }}/extracted/V005_ANDROID_CHROMIUM_WEBVIEW_C002

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          java -version
          gradle --version

      - name: Validate C003
        working-directory: extracted/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        shell: bash
        run: |
          set -euo pipefail
          chmod +x run_core_tests.sh run_validation.sh
          ./run_validation.sh

      - name: Build APK
        working-directory: extracted/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify canonical NEXUS launcher in APK
        uses: mobilexiaoben-byte/nexus-v005-android-c002/branding/verify-apk@main
        with:
          apk: ${{ github.workspace }}/extracted/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          cp extracted/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/build/outputs/apk/debug/app-debug.apk \
             NEXUS-V005-C003-debug.apk
          sha256sum NEXUS-V005-C003-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C003-debug
          path: NEXUS-V005-C003-debug.apk
          if-no-files-found: error
