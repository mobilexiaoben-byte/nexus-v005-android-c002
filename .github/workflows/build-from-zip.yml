name: NEXUS V005 C002 - Build APK from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Extract NEXUS C002
        shell: bash
        run: |
          set -euo pipefail
          test -f V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip
          mkdir extracted
          unzip -q V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d extracted
          test -f extracted/V005_ANDROID_CHROMIUM_WEBVIEW_C002/settings.gradle.kts

      - name: Apply canonical NEXUS launcher branding
        uses: mobilexiaoben-byte/nexus-v005-android-c002/branding@main
        with:
          root: ${{ github.workspace }}/extracted/V005_ANDROID_CHROMIUM_WEBVIEW_C002

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          java -version
          gradle --version

      - name: Validate C002
        working-directory: extracted/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        shell: bash
        run: |
          set -euo pipefail
          chmod +x run_core_tests.sh run_validation.sh
          ./run_validation.sh

      - name: Build APK
        working-directory: extracted/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify canonical NEXUS launcher in APK
        uses: mobilexiaoben-byte/nexus-v005-android-c002/branding/verify-apk@main
        with:
          apk: ${{ github.workspace }}/extracted/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          cp extracted/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/build/outputs/apk/debug/app-debug.apk \
             NEXUS-V005-C002-debug.apk
          sha256sum NEXUS-V005-C002-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-debug
          path: NEXUS-V005-C002-debug.apk
          if-no-files-found: error
