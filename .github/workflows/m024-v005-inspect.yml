name: M024 V005 policy inspection

on:
  push:
    branches: [m024-v005-policy-router-candidate]
    paths: ['.github/workflows/m024-v005-inspect.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Inspect all research restrictions
        shell: bash
        run: |
          set -euo pipefail
          echo '69f88ce310515d94c7225a080d615c64c7bc3dac786cc2a9d590901599fa6670  V005_ANDROID_CHROMIUM_WEBVIEW_C003.zip' | sha256sum -c -
          rm -rf /tmp/v005 && mkdir /tmp/v005
          unzip -q V005_ANDROID_CHROMIUM_WEBVIEW_C003.zip -d /tmp/v005
          ROOT=/tmp/v005/V005_ANDROID_CHROMIUM_WEBVIEW_C002
          for f in "$ROOT/app/src/main/assets/nexus/chatgpt_provider_c002.js" "$ROOT/app/src/main/assets/nexus/claude_provider_c002.js"; do
            echo "=== $f research/prompt matches ==="
            grep -n -B 8 -A 12 -Ei 'browse|research|frozen package|supplied frozen|external_research' "$f" || true
          done
          echo '=== Static scripts research matches ==='
          grep -RIn -E 'EXTERNAL_RESEARCH_FORBIDDEN|external_research|externalResearch' "$ROOT" --exclude='*.class' --exclude-dir=.gradle || true
