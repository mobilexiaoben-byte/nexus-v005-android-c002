name: M024 V005 policy inspection

on:
  push:
    branches: [m024-v005-policy-router-candidate]
    paths: ['.github/workflows/m024-v005-inspect.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify baseline and inspect policy contract
        shell: bash
        run: |
          set -euo pipefail
          echo '69f88ce310515d94c7225a080d615c64c7bc3dac786cc2a9d590901599fa6670  V005_ANDROID_CHROMIUM_WEBVIEW_C003.zip' | sha256sum -c -
          rm -rf /tmp/v005 && mkdir /tmp/v005
          unzip -q V005_ANDROID_CHROMIUM_WEBVIEW_C003.zip -d /tmp/v005
          ROOT=/tmp/v005/V005_ANDROID_CHROMIUM_WEBVIEW_C002
          echo '=== TransportContract.kt ==='
          sed -n '1,190p' "$ROOT/app/src/main/java/nexus/android/c002/core/TransportContract.kt"
          echo '=== MainActivity relevant ==='
          sed -n '80,125p' "$ROOT/app/src/main/java/nexus/android/c002/MainActivity.kt"
          echo '=== ChatGPT provider relevant ==='
          sed -n '310,350p' "$ROOT/app/src/main/assets/nexus/chatgpt_provider_c002.js"
          echo '=== Claude provider relevant ==='
          sed -n '305,345p' "$ROOT/app/src/main/assets/nexus/claude_provider_c002.js"
          echo '=== Core tests ==='
          sed -n '1,80p' "$ROOT/core-tests/TestMain.kt"
          echo '=== Existing validation ==='
          chmod +x "$ROOT/run_validation.sh" "$ROOT/run_core_tests.sh"
          "$ROOT/run_validation.sh"
