# NEXUS_GOVERNANCE_ENFORCED_C003
name: U013 SHARED UX V31 GOLDEN 010

on:
  push:
    branches: [u013-shared-ux-v31-golden-010]
    paths:
      - '.github/workflows/u013-shared-ux-v31-golden-010.yml'
      - 'u013ux010/**'
      - 'governance/preflight/u013-shared-ux-v31.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout U013 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mandatory U013 Golden preflight
        shell: bash
        run: python3 governance/golden_guard.py --manifest governance/preflight/u013-shared-ux-v31.json

      - name: Checkout proven Runtime019 web-monitor lineage
        uses: actions/checkout@v6
        with:
          ref: v007-m024-u013-provider-runtime-019-web-monitor-fix
          path: legacy
          fetch-depth: 1

      - name: Checkout ChatGPT Golden source
        uses: actions/checkout@v6
        with:
          ref: cb82ece5e9a29a21115b5127cee69fd5b9a06987
          path: golden_chatgpt
          fetch-depth: 1

      - name: Checkout Gemini Golden source
        uses: actions/checkout@v6
        with:
          ref: 48494565af818bf6859ba4fa90e2e8d0db0397fa
          path: golden_gemini
          fetch-depth: 1

      - name: Generate Golden Recovery base then U013 UX adapter
        shell: bash
        run: |
          set -euo pipefail
          echo '69f88ce310515d94c7225a080d615c64c7bc3dac786cc2a9d590901599fa6670  V005_ANDROID_CHROMIUM_WEBVIEW_C003.zip' | sha256sum -c -

          cp V005_ANDROID_CHROMIUM_WEBVIEW_C003.zip legacy/V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip
          rm -rf legacy/base work golden_chatgpt/base golden_chatgpt/work golden_gemini/base golden_gemini/work
          mkdir -p legacy/base work golden_chatgpt/base golden_chatgpt/work golden_gemini/base golden_gemini/work
          unzip -q legacy/V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d legacy/base

          python3 legacy/u013ux009/derive.py "$GITHUB_WORKSPACE/legacy" "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          python3 legacy/reconcile001/apply_reconcile.py "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          python3 legacy/reconcile019/provider_runtime_019.py "$GITHUB_WORKSPACE/legacy" "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

          unzip -q golden_chatgpt/V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d golden_chatgpt/base
          python3 golden_chatgpt/executionproof006_uiretry1/derive.py "$GITHUB_WORKSPACE/golden_chatgpt" "$GITHUB_WORKSPACE/golden_chatgpt/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

          unzip -q golden_gemini/V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d golden_gemini/base
          python3 golden_gemini/geminiproof001/derive.py "$GITHUB_WORKSPACE/golden_gemini" "$GITHUB_WORKSPACE/golden_gemini/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

          cp golden_chatgpt/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/src/main/assets/nexus/chatgpt_provider_c002.js work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/src/main/assets/nexus/chatgpt_provider_c002.js
          cp golden_gemini/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/src/main/assets/nexus/gemini_provider_c002.js work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/src/main/assets/nexus/gemini_provider_c002.js

          python3 golden_recovery001/apply_capture_repair.py "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          python3 u013ux010/apply_shared_ux.py "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002" "$GITHUB_WORKSPACE"

      - name: Validate Golden + U013 composition
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          CHAT="$ROOT/app/src/main/assets/nexus/chatgpt_provider_c002.js"
          GEM="$ROOT/app/src/main/assets/nexus/gemini_provider_c002.js"
          MAIN="$ROOT/app/src/main/java/nexus/android/c002/MainActivity.kt"
          TC="$ROOT/app/src/main/java/nexus/android/c002/core/TransportContract.kt"
          ADAPTER="$ROOT/app/src/main/java/nexus/android/c002/AndroidPlatformAdapter.kt"
          LOCK="$ROOT/U013_COMPOSITION_LOCK.txt"

          "$ROOT/run_core_tests.sh" | tee /tmp/CORE.txt
          grep -F 'fail=0' /tmp/CORE.txt
          node --check "$CHAT"
          node --check "$GEM"

          grep -F 'function assistantSnapshot()' "$CHAT"
          grep -F 'function modelResponseSnapshot()' "$GEM"
          grep -F 'JobType.OPEN_ANALYSIS -> ResearchPolicy.OPTIONAL' "$TC"
          grep -F 'JobType.CLOSED_AUDIT -> ResearchPolicy.FORBIDDEN' "$TC"
          grep -F 'Rapport des échanges NEXUS ↔' "$MAIN"
          grep -F 'Cycle courant uniquement' "$MAIN"

          test -f "$ADAPTER"
          grep -F 'class AndroidPlatformAdapter' "$ADAPTER"
          grep -F 'Mes travaux' "$ADAPTER"
          grep -F 'Fact Check' "$ADAPTER"
          grep -F 'Cartes' "$ADAPTER"
          grep -F 'Sujets persistants' "$ADAPTER"
          grep -F 'Analyses locales' "$ADAPTER"
          grep -F 'Archives' "$ADAPTER"
          grep -F 'NEXUS Context' "$ADAPTER"
          grep -F 'Paramètres' "$ADAPTER"
          grep -F 'u013PlatformAdapter.install()' "$MAIN"
          grep -F 'handleSystemBack()' "$MAIN"

          grep -F 'RUNTIME_BASELINE=V007_GOLDEN_RECOVERY_001' "$LOCK"
          grep -F 'M024=UNCHANGED' "$LOCK"
          grep -F 'PROVIDER_ADAPTERS=UNCHANGED_GOLDEN_RECOVERY' "$LOCK"
          grep -F 'FACTCHECK_O24=UNCHANGED' "$LOCK"
          grep -F 'MONITORING=UNCHANGED' "$LOCK"
          grep -F 'RESULT_PACK=UNCHANGED' "$LOCK"
          grep -F 'CANONICAL_WRITE=false' "$LOCK"

          grep -F 'versionCode = 74' "$ROOT/app/build.gradle.kts"
          grep -F 'versionName = "0.0.74-u013-shared-ux-v31-golden010"' "$ROOT/app/build.gradle.kts"
          printf 'U013_SHARED_UX_V31_STATIC_RESULT pass=20 fail=0\n' | tee /tmp/U013_STATIC.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Apply canonical NEXUS launcher branding
        uses: mobilexiaoben-byte/nexus-v005-android-c002/branding@main
        with:
          root: ${{ github.workspace }}/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002

      - name: Build APK
        working-directory: work/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify candidate and evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/BADGING.txt
          grep -F "versionCode='74'" /tmp/BADGING.txt
          grep -F "application-label:'NEXUS'" /tmp/BADGING.txt
          cp "$APK" NEXUS-U013-SHARED-UX-V31-GOLDEN-010-debug.apk
          sha256sum NEXUS-U013-SHARED-UX-V31-GOLDEN-010-debug.apk | tee NEXUS-U013-SHARED-UX-V31-GOLDEN-010-debug.apk.sha256
          cp "$ROOT/U013_COMPOSITION_LOCK.txt" .

      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: NEXUS-U013-SHARED-UX-V31-GOLDEN-010-debug.apk
          path: NEXUS-U013-SHARED-UX-V31-GOLDEN-010-debug.apk
          archive: false
          if-no-files-found: error

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-U013-SHARED-UX-V31-GOLDEN-010-evidence
          path: |
            NEXUS-U013-SHARED-UX-V31-GOLDEN-010-debug.apk.sha256
            U013_COMPOSITION_LOCK.txt
            /tmp/CORE.txt
            /tmp/U013_STATIC.txt
            /tmp/BADGING.txt
          if-no-files-found: error
