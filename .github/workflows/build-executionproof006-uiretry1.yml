name: NEXUS V005 EXECUTION PROOF 006 UIRETRY1 - Build APK

on:
  push:
    branches: [v005-executionproof006-uiretry1]
    paths: ['.github/workflows/build-executionproof006-uiretry1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Validate frozen C002
        shell: bash
        run: |
          set -euo pipefail
          echo '26b5b157b487eda3a0c92198066d39beb5e6eb1149a3c4a705b49274c636eed4  V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip' | sha256sum -c -
          mkdir base
          unzip -q V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d base
          cd base/V005_ANDROID_CHROMIUM_WEBVIEW_C002
          chmod +x run_validation.sh run_core_tests.sh
          ./run_validation.sh | tee /tmp/C002_VALIDATION.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/C002_VALIDATION.txt
          grep -F 'STATIC_RESULT pass=10 fail=0' /tmp/C002_VALIDATION.txt

      - name: Derive bounded UI retry proof
        shell: bash
        run: |
          set -euo pipefail
          python3 executionproof006_uiretry1/derive.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          ROOT='work/V005_ANDROID_CHROMIUM_WEBVIEW_C002'
          sha256sum "$ROOT/app/src/main/java/nexus/android/c002/MainActivity.kt" \
                    "$ROOT/app/src/main/assets/nexus/chatgpt_provider_c002.js" \
                    "$ROOT/app/src/main/java/nexus/android/c002/web/OriginPolicy.kt" \
                    "$ROOT/app/src/main/java/nexus/android/c002/web/NexusWebBridge.kt" \
                    "$ROOT/app/src/main/assets/nexus/claude_provider_c002.js" \
                    > /tmp/UIRETRY1_SOURCE_SHA256.txt
          echo '2c98dcaac3a85a5abf3bdb76fd462542b7d15b122cdb95be896f5d9207fca59d  work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/src/main/java/nexus/android/c002/web/OriginPolicy.kt' | sha256sum -c -

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Validate derivative
        shell: bash
        run: |
          set -euo pipefail
          ROOT='work/V005_ANDROID_CHROMIUM_WEBVIEW_C002'
          chmod +x executionproof006_uiretry1/run_validation.sh
          "$ROOT/run_core_tests.sh" | tee /tmp/UIRETRY1_CORE.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/UIRETRY1_CORE.txt
          executionproof006_uiretry1/run_validation.sh "$ROOT" | tee /tmp/UIRETRY1_VALIDATION.txt
          grep -F 'EXECUTION_PROOF_006_UIRETRY1_STATIC_RESULT pass=47 fail=0' /tmp/UIRETRY1_VALIDATION.txt

      - name: Build APK
        working-directory: work/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/build/outputs/apk/debug/app-debug.apk NEXUS-V005-C002-EXECUTION-PROOF-006-UIRETRY1-debug.apk
          sha256sum NEXUS-V005-C002-EXECUTION-PROOF-006-UIRETRY1-debug.apk > NEXUS-V005-C002-EXECUTION-PROOF-006-UIRETRY1-debug.apk.sha256
          cp /tmp/C002_VALIDATION.txt .
          cp /tmp/UIRETRY1_CORE.txt .
          cp /tmp/UIRETRY1_VALIDATION.txt .
          cp /tmp/UIRETRY1_SOURCE_SHA256.txt .
          (cd work && zip -qr ../V005_ANDROID_CHROMIUM_WEBVIEW_C002_EXECUTION_PROOF_006_UIRETRY1.zip V005_ANDROID_CHROMIUM_WEBVIEW_C002)
          sha256sum V005_ANDROID_CHROMIUM_WEBVIEW_C002_EXECUTION_PROOF_006_UIRETRY1.zip > V005_ANDROID_CHROMIUM_WEBVIEW_C002_EXECUTION_PROOF_006_UIRETRY1.zip.sha256
          cat NEXUS-V005-C002-EXECUTION-PROOF-006-UIRETRY1-debug.apk.sha256
          cat V005_ANDROID_CHROMIUM_WEBVIEW_C002_EXECUTION_PROOF_006_UIRETRY1.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-EXECUTION-PROOF-006-UIRETRY1-debug
          path: NEXUS-V005-C002-EXECUTION-PROOF-006-UIRETRY1-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-EXECUTION-PROOF-006-UIRETRY1-source
          path: V005_ANDROID_CHROMIUM_WEBVIEW_C002_EXECUTION_PROOF_006_UIRETRY1.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-EXECUTION-PROOF-006-UIRETRY1-evidence
          path: |
            NEXUS-V005-C002-EXECUTION-PROOF-006-UIRETRY1-debug.apk.sha256
            V005_ANDROID_CHROMIUM_WEBVIEW_C002_EXECUTION_PROOF_006_UIRETRY1.zip.sha256
            UIRETRY1_SOURCE_SHA256.txt
            C002_VALIDATION.txt
            UIRETRY1_CORE.txt
            UIRETRY1_VALIDATION.txt
          if-no-files-found: error
