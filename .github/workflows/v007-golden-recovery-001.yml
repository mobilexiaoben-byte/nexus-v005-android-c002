name: V007 GOLDEN RECOVERY 005 GEMINI MANUAL AUTH FIX

on:
  push:
    branches: [v007-golden-recovery-005-gemini-manual-auth-fix]
    paths:
      - '.github/workflows/v007-golden-recovery-001.yml'
      - 'golden_recovery001/**'
      - 'golden_recovery002/**'
      - 'golden_recovery003/**'
      - 'golden_recovery004/**'
      - 'golden_recovery005/**'
      - 'governance/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned OPA
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo opa https://openpolicyagent.org/downloads/v1.20.2/opa_linux_amd64_static
          echo "69da5179ee403d10fa11bab6cfb4ffb0d23dba5f9b682fa977db772a1da5670f  opa" | sha256sum -c -
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Mandatory NEXUS Golden preflight
        shell: bash
        run: python3 governance/golden_guard.py --manifest governance/preflight/android-provider-runtime.json

      - name: Mandatory NEXUS OPA dual enforcement
        shell: bash
        run: python3 governance/opa/dual_guard.py --manifest governance/preflight/android-provider-runtime.json

      - name: Checkout proven Runtime019 web-monitor lineage as source material
        uses: actions/checkout@v6
        with:
          ref: v007-m024-u013-provider-runtime-019-web-monitor-fix
          path: legacy
          fetch-depth: 1

      - name: Checkout ChatGPT Golden source
        uses: actions/checkout@v6
        with:
          ref: cb82ece5e9a29a21115b5127cee69fd5b9a06987
          path: golden_chatgpt
          fetch-depth: 1

      - name: Checkout Gemini Golden source
        uses: actions/checkout@v6
        with:
          ref: 48494565af818bf6859ba4fa90e2e8d0db0397fa
          path: golden_gemini
          fetch-depth: 1

      - name: Generate candidate strictly from frozen C003
        shell: bash
        run: |
          set -euo pipefail
          echo '69f88ce310515d94c7225a080d615c64c7bc3dac786cc2a9d590901599fa6670  V005_ANDROID_CHROMIUM_WEBVIEW_C003.zip' | sha256sum -c -

          # Force the historical derivation chain to consume C003, not its old C002 file.
          cp V005_ANDROID_CHROMIUM_WEBVIEW_C003.zip legacy/V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip
          rm -rf legacy/base work
          mkdir -p legacy/base work
          unzip -q legacy/V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d legacy/base
          test -f legacy/base/V005_ANDROID_CHROMIUM_WEBVIEW_C002/settings.gradle.kts

          python3 legacy/u013ux009/derive.py             "$GITHUB_WORKSPACE/legacy"             "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

          python3 legacy/reconcile001/apply_reconcile.py             "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

          python3 legacy/reconcile019/provider_runtime_019.py             "$GITHUB_WORKSPACE/legacy"             "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

          # Reconstruct exact certified provider assets from their DEVICE-PASS commits.
          rm -rf golden_chatgpt/base golden_chatgpt/work golden_gemini/base golden_gemini/work
          mkdir -p golden_chatgpt/base golden_chatgpt/work golden_gemini/base golden_gemini/work
          unzip -q golden_chatgpt/V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d golden_chatgpt/base
          python3 golden_chatgpt/executionproof006_uiretry1/derive.py "$GITHUB_WORKSPACE/golden_chatgpt" "$GITHUB_WORKSPACE/golden_chatgpt/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

          unzip -q golden_gemini/V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d golden_gemini/base
          python3 golden_gemini/geminiproof001/derive.py "$GITHUB_WORKSPACE/golden_gemini" "$GITHUB_WORKSPACE/golden_gemini/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

          cp golden_chatgpt/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/src/main/assets/nexus/chatgpt_provider_c002.js work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/src/main/assets/nexus/chatgpt_provider_c002.js
          cp golden_gemini/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/src/main/assets/nexus/gemini_provider_c002.js work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/src/main/assets/nexus/gemini_provider_c002.js

          python3 golden_recovery001/apply_capture_repair.py             "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          python3 golden_recovery002/apply_device_fixes.py             "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          python3 golden_recovery003/apply_auth_execution_fix.py             "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          python3 golden_recovery004/apply_golden_diff_fix.py             "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          python3 golden_recovery005/apply_gemini_manual_auth_fix.py             "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

      - name: Validate Golden recovery invariants
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          CHAT="$ROOT/app/src/main/assets/nexus/chatgpt_provider_c002.js"
          GEM="$ROOT/app/src/main/assets/nexus/gemini_provider_c002.js"
          ZAI="$ROOT/app/src/main/assets/nexus/zai_provider_c002.js"
          MAIN="$ROOT/app/src/main/java/nexus/android/c002/MainActivity.kt"
          TC="$ROOT/app/src/main/java/nexus/android/c002/core/TransportContract.kt"

          "$ROOT/run_core_tests.sh" | tee /tmp/CORE.txt
          grep -F 'fail=0' /tmp/CORE.txt

          node --check "$CHAT"
          node --check "$GEM"
          node --check "$ZAI"

          # ChatGPT manual confirmation must be consumed by the adapter; no automatic login added.
          grep -F 'user_confirmed_connected===true' "$CHAT"
          grep -F "USER_CONFIRMED_CONNECTED__" "$CHAT"
          grep -F 'function assistantSnapshot()' "$CHAT"
          grep -F 'waitForAssistantResult(beforeSnapshot,envelope,80000)' "$CHAT"
          grep -F 'function findRetryButton()' "$CHAT"
          grep -F 'CHATGPT_UI_RESPONSE_ERROR_RETRY_AVAILABLE' "$CHAT"
          grep -F 'changed_assistant_count' "$CHAT"
          ! grep -F 'beforeCount=assistantNodes().length' "$CHAT"

          grep -F "const CHANNEL='NEXUS_V004_GEMINI_001'" "$GEM"
          grep -F 'function modelResponseSnapshot()' "$GEM"
          grep -F 'waitForModelResult(bridgeRunId,beforeSnapshot,envelope)' "$GEM"
          grep -F 'GEMINI_PROMPT_SUBMISSION_NOT_ESTABLISHED' "$GEM"
          grep -F 'changed_response_count' "$GEM"
          grep -F 'submittedUserPromptObserved(envelope)' "$GEM"
          grep -F 'timeout=20000' "$GEM"
          grep -F 'user_confirmed_connected===true' "$GEM"
          grep -F 'USER_CONFIRMED_CONNECTED__' "$GEM"
          grep -F 'GEMINI_NOT_AUTHENTICATED' "$GEM"
          ! grep -F 'beforeCount=modelResponseNodes().length' "$GEM"

          # Z.ai send/submission and M024 prompt remain current; result capture is restored to the DEVICE-PASS Golden strategy.
          grep -F 'ZAI_UI_PROMPT_SENT_CONFIRMED' "$ZAI"
          grep -F 'waitForSubmissionEstablished(envelope,beforeCount)' "$ZAI"
          grep -F 'function parseCompleteResultCandidate(text){' "$ZAI"
          grep -F 'waitForModelResult(bridgeRunId,beforeCount,timeout=160000)' "$ZAI"
          grep -F 'const start=Math.min(beforeCount,nodes.length);' "$ZAI"
          grep -F 'Date.now()-validSince>=5000' "$ZAI"
          grep -F 'parseCompleteResultCandidate(txt);' "$ZAI"
          ! grep -F 'parseCompleteResultCandidate(txt,envelope)' "$ZAI"
          ! grep -F 'changed_response_count' "$ZAI"
          grep -F 'Research policy OPTIONAL' "$ZAI"

          # Manual login/confirmation remains authoritative; stale auth state cannot block after explicit confirmation.
          grep -F 'private val manualProviderConfirmationMode = true' "$MAIN"
          grep -F 'DESCRIBE_OVERRIDE=MANUAL_CONFIRMATION' "$MAIN"
          grep -F 'DESCRIBE PASS — $provider ready (manual confirmation)' "$MAIN"

          # Execution identity is unique per Analyse cycle while duplicate-receipt guard remains intact.
          grep -F 'activeExecutionId = "U013-ANDROID-" + System.currentTimeMillis()' "$MAIN"
          grep -F 'requestId = activeExecutionId' "$MAIN"
          grep -F 'const val LEGACY_JOB_ID_REFERENCE' "$MAIN"
          ! grep -F 'const val JOB_ID =' "$MAIN"
          grep -F 'ackPassed = false' "$MAIN"
          grep -F 'proofJob = null' "$MAIN"
          grep -F 'ANDROID_DUPLICATE_EXECUTION_ID' "$TC"

          # M024 Web policy and readable terminal report remain present.
          grep -F 'JobType.OPEN_ANALYSIS -> ResearchPolicy.OPTIONAL' "$TC"
          grep -F 'JobType.CLOSED_AUDIT -> ResearchPolicy.FORBIDDEN' "$TC"
          ! grep -F 'Do NOT browse the web and do NOT perform external research' "$CHAT"
          ! grep -F 'Do NOT browse the web and do NOT perform external research' "$GEM"
          grep -F 'Rapport des échanges NEXUS ↔' "$MAIN"
          grep -F 'Cycle courant uniquement' "$MAIN"
          grep -F 'finishReadableMonitorReport(true' "$MAIN"

          grep -F 'versionCode = 77' "$ROOT/app/build.gradle.kts"
          grep -F 'versionName = "0.0.77-v007-golden-recovery005-gemini-manual-auth-fix"' "$ROOT/app/build.gradle.kts"

          printf 'GOLDEN_RECOVERY_005_STATIC_RESULT pass=1 fail=0\n' | tee /tmp/STATIC.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Apply canonical NEXUS launcher branding
        uses: mobilexiaoben-byte/nexus-v005-android-c002/branding@main
        with:
          root: ${{ github.workspace }}/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002

      - name: Build APK
        working-directory: work/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK and evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/BADGING.txt
          grep -F "versionCode='77'" /tmp/BADGING.txt
          grep -F "application-label:'NEXUS'" /tmp/BADGING.txt

          cp "$APK" NEXUS-V007-GOLDEN-RECOVERY-005-debug.apk
          sha256sum NEXUS-V007-GOLDEN-RECOVERY-005-debug.apk | tee NEXUS-V007-GOLDEN-RECOVERY-005-debug.apk.sha256
          cp "$ROOT/RECONCILIATION_LOCK.txt" .

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V007-GOLDEN-RECOVERY-005-debug.apk
          path: NEXUS-V007-GOLDEN-RECOVERY-005-debug.apk
          archive: false
          if-no-files-found: error

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-V007-GOLDEN-RECOVERY-005-evidence
          path: |
            NEXUS-V007-GOLDEN-RECOVERY-005-debug.apk.sha256
            RECONCILIATION_LOCK.txt
            /tmp/CORE.txt
            /tmp/STATIC.txt
            /tmp/BADGING.txt
          if-no-files-found: error
