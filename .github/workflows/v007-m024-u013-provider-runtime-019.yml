name: V007 M024 U013 PROVIDER RUNTIME 019 GEMINI CAPTURE FIX

on:
  push:
    branches: [v007-m024-u013-provider-runtime-019-gemini-capture-fix]
    paths:
      - '.github/workflows/v007-m024-u013-provider-runtime-019.yml'
      - 'reconcile019/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: NEXUS mandatory Golden preflight
        shell: bash
        run: python3 governance/golden_guard.py --manifest governance/preflight/android-provider-runtime.json

      - name: Generate Runtime019 source
        shell: bash
        run: |
          set -euo pipefail
          echo '26b5b157b487eda3a0c92198066d39beb5e6eb1149a3c4a705b49274c636eed4  V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip' | sha256sum -c -
          rm -rf base work
          mkdir -p base work
          unzip -q V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d base
          cp -a base/V005_ANDROID_CHROMIUM_WEBVIEW_C002 work/
          python3 u013ux009/derive.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          python3 reconcile001/apply_reconcile.py "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          python3 reconcile019/provider_runtime_019.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

      - name: Validate Runtime019 invariants
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          MAIN="$ROOT/app/src/main/java/nexus/android/c002/MainActivity.kt"
          GEM="$ROOT/app/src/main/assets/nexus/gemini_provider_c002.js"
          TC="$ROOT/app/src/main/java/nexus/android/c002/core/TransportContract.kt"
          MON="$ROOT/app/src/main/assets/nexus/nexus_existing_guest_monitor_patch.js"

          "$ROOT/run_core_tests.sh" | tee /tmp/CORE.txt
          grep -F 'fail=0' /tmp/CORE.txt
          grep -F 'JobType.OPEN_ANALYSIS -> ResearchPolicy.OPTIONAL' "$TC"
          grep -F 'JobType.CLOSED_AUDIT -> ResearchPolicy.FORBIDDEN' "$TC"
          grep -F 'JobType.POPINT_RESEARCH -> ResearchPolicy.REQUIRED' "$TC"

          node --check "$GEM"
          grep -F 'function responseSnapshot()' "$GEM"
          grep -F 'function responseChanged(nodes,beforeSnapshot)' "$GEM"
          grep -F 'parseCompleteResultCandidate(txt,envelope)' "$GEM"
          grep -F 'changed_response_count' "$GEM"
          grep -F 'timeout=175000' "$GEM"
          grep -F '[data-message-author-role="model"]' "$GEM"
          grep -F '[data-test-id*="response" i]' "$GEM"
          ! grep -F 'nodes.length>beforeCount' "$GEM"

          grep -F 'RuntimeGate.validateDescriptor(descriptor, expectedProviderOrigin)' "$MAIN"
          ! grep -F 'RuntimeGate.validateDescriptor(descriptor, CHATGPT_ORIGIN)' "$MAIN"
          ! grep -F 'Exécution bloquée · vérification de sécurité' "$MAIN"

          echo 'd3a2f5a9fcaa5e755226c3d04145ddc46e20862e0eaf034f3b8f646babe093aa  reconcile015/nexus_existing_guest_monitor_patch.js' | sha256sum -c -
          node --check "$MON"
          cmp -s "$MON" "$GITHUB_WORKSPACE/reconcile015/nexus_existing_guest_monitor_patch.js"

          grep -F 'versionCode = 72' "$ROOT/app/build.gradle.kts"
          grep -F 'versionName = "0.0.72-v007-m024-u013-provider-runtime019-gemini-capture-fix"' "$ROOT/app/build.gradle.kts"
          printf 'PROVIDER_RUNTIME_019_STATIC_RESULT pass=20 fail=0\n' | tee /tmp/STATIC019.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Apply NEXUS launcher branding
        uses: mobilexiaoben-byte/nexus-v005-android-c002/branding@main
        with:
          root: ${{ github.workspace }}/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002

      - name: Build APK
        working-directory: work/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/BADGING.txt
          grep -F "versionCode='72'" /tmp/BADGING.txt
          grep -F "application-label:'NEXUS'" /tmp/BADGING.txt
          cp "$APK" NEXUS-V007-M024-U013-PROVIDER-RUNTIME-019-GEMINI-CAPTURE-FIX-debug.apk
          sha256sum NEXUS-V007-M024-U013-PROVIDER-RUNTIME-019-GEMINI-CAPTURE-FIX-debug.apk | tee NEXUS-V007-M024-U013-PROVIDER-RUNTIME-019-GEMINI-CAPTURE-FIX-debug.apk.sha256
          cp "$ROOT/RECONCILIATION_LOCK.txt" .

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          path: NEXUS-V007-M024-U013-PROVIDER-RUNTIME-019-GEMINI-CAPTURE-FIX-debug.apk
          archive: false
          if-no-files-found: error

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-V007-M024-U013-PROVIDER-RUNTIME-019-GEMINI-CAPTURE-FIX-evidence
          path: |
            NEXUS-V007-M024-U013-PROVIDER-RUNTIME-019-GEMINI-CAPTURE-FIX-debug.apk.sha256
            RECONCILIATION_LOCK.txt
            /tmp/CORE.txt
            /tmp/STATIC019.txt
            /tmp/BADGING.txt
          if-no-files-found: error
