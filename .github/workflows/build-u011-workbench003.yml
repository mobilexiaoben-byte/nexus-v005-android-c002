name: NEXUS U011 Workbench 003 Baselocked

on:
  push:
    branches: [u011-workbench-003-baselocked]
    paths:
      - 'u011workbench003/**'
      - '.github/workflows/build-u011-workbench003.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify immutable locked originals
        shell: bash
        run: |
          set -euo pipefail
          LOCK=03677274f120ea552ee94e08947623c988fddd8a
          git cat-file -e "$LOCK^{commit}"
          git diff --exit-code "$LOCK" -- V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip executionproof006_uiretry1 v007authfix2 u004ux001 u004ux002 u004ux003 u004ux004
          echo 'LOCKED_ORIGINALS_UNCHANGED=PASS'

      - name: Materialize candidate sources
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'workbench.html' 'derive.py' 'run_validation.sh'; do
            base64 -d "u011workbench003/${spec}.gz.b64" | gzip -dc > "u011workbench003/${spec}"
          done
          chmod +x u011workbench003/run_validation.sh
          python3 -m py_compile u011workbench003/derive.py
          test -s u011workbench003/workbench.html

      - name: Validate frozen C002
        shell: bash
        run: |
          set -euo pipefail
          echo '26b5b157b487eda3a0c92198066d39beb5e6eb1149a3c4a705b49274c636eed4  V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip' | sha256sum -c -
          mkdir base
          unzip -q V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d base
          cd base/V005_ANDROID_CHROMIUM_WEBVIEW_C002
          chmod +x run_validation.sh run_core_tests.sh
          ./run_validation.sh | tee /tmp/C002_VALIDATION.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/C002_VALIDATION.txt
          grep -F 'STATIC_RESULT pass=10 fail=0' /tmp/C002_VALIDATION.txt

      - name: Derive Workbench 003 from U004 SHELL 004
        shell: bash
        run: |
          set -euo pipefail
          python3 u011workbench003/derive.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Validate core and Workbench gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT='work/V005_ANDROID_CHROMIUM_WEBVIEW_C002'
          "$ROOT/run_core_tests.sh" | tee /tmp/U011_WB003_CORE.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/U011_WB003_CORE.txt
          u011workbench003/run_validation.sh "$ROOT" | tee /tmp/U011_WB003_STATIC.txt
          grep -F 'U011_WB003_STATIC_RESULT pass=19 fail=0' /tmp/U011_WB003_STATIC.txt
          sha256sum "$ROOT/app/src/main/java/nexus/android/c002/MainActivity.kt" "$ROOT/app/src/main/java/nexus/android/c002/WorkbenchActivity.kt" "$ROOT/app/src/main/assets/nexus/chatgpt_provider_c002.js" "$ROOT/app/src/main/assets/u011/workbench.html" > /tmp/U011_WB003_SOURCE_SHA256.txt

      - name: Apply canonical NEXUS branding
        uses: mobilexiaoben-byte/nexus-v005-android-c002/branding@main
        with:
          root: ${{ github.workspace }}/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002

      - name: Build APK
        working-directory: work/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK='work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/U011_WB003_BADGING.txt
          grep -F "package: name='nexus.android.u011.workbench003'" /tmp/U011_WB003_BADGING.txt
          grep -F "application-label:'NEXUS'" /tmp/U011_WB003_BADGING.txt
          grep -F "launchable-activity: name='nexus.android.c002.WorkbenchActivity'" /tmp/U011_WB003_BADGING.txt

      - name: Package artifacts and evidence
        shell: bash
        run: |
          set -euo pipefail
          APK='NEXUS-U011-WORKBENCH-003-debug.apk'
          cp work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cp /tmp/C002_VALIDATION.txt /tmp/U011_WB003_CORE.txt /tmp/U011_WB003_STATIC.txt /tmp/U011_WB003_SOURCE_SHA256.txt /tmp/U011_WB003_BADGING.txt .
          cat > U011_WORKBENCH_003_BUILD_RECEIPT.txt <<'EOF'
          NEXUS U011 WORKBENCH 003 — BUILD RECEIPT
          BASE=U004_UX_SHELL_004@03677274f120ea552ee94e08947623c988fddd8a
          AUTH=V007_AUTHFIX2_LINEAGE_PRESERVED
          CHATGPT=WIRED_FOR_DEVICE_GATE
          GEMINI=DEVICE_PASS_REFERENCE_LOCKED_NOT_WIRED_003
          ZAI=DEVICE_PASS_REFERENCE_LOCKED_NOT_WIRED_003
          CLAUDE=LIMITATION_ANDROID_NON_CERTIFIED
          DEVICE_ROUNDTRIP=PENDING
          CANONICAL_WRITE=false
          STATE_MUTATION_MODE=NONE
          EOF
          (cd work && zip -qr ../U011_WORKBENCH_003_SOURCE.zip V005_ANDROID_CHROMIUM_WEBVIEW_C002)
          sha256sum U011_WORKBENCH_003_SOURCE.zip > U011_WORKBENCH_003_SOURCE.zip.sha256
          cat "$APK.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-U011-WORKBENCH-003-debug
          path: NEXUS-U011-WORKBENCH-003-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-U011-WORKBENCH-003-source
          path: U011_WORKBENCH_003_SOURCE.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-U011-WORKBENCH-003-evidence
          path: |
            NEXUS-U011-WORKBENCH-003-debug.apk.sha256
            U011_WORKBENCH_003_SOURCE.zip.sha256
            C002_VALIDATION.txt
            U011_WB003_CORE.txt
            U011_WB003_STATIC.txt
            U011_WB003_SOURCE_SHA256.txt
            U011_WB003_BADGING.txt
            U011_WORKBENCH_003_BUILD_RECEIPT.txt
          if-no-files-found: error
