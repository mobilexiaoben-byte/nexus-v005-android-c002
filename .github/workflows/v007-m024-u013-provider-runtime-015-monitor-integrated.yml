name: V007 M024 U013 PROVIDER RUNTIME 015 MONITOR INTEGRATED

on:
  push:
    branches: [v007-m024-u013-provider-runtime-015-monitor-integrated]
    paths:
      - '.github/workflows/v007-m024-u013-provider-runtime-015-monitor-integrated.yml'
      - 'reconcile001/**'
      - 'reconcile004/**'
      - 'reconcile005/**'
      - 'reconcile006/**'
      - 'reconcile007/**'
      - 'reconcile008/**'
      - 'reconcile009/**'
      - 'reconcile010/**'
      - 'reconcile012/**'
      - 'reconcile013/**'
      - 'reconcile014/**'
      - 'reconcile015/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Validate frozen C002 baseline
        shell: bash
        run: |
          set -euo pipefail
          echo '26b5b157b487eda3a0c92198066d39beb5e6eb1149a3c4a705b49274c636eed4  V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip' | sha256sum -c -
          rm -rf base work
          mkdir -p base work
          unzip -q V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d base
          cd base/V005_ANDROID_CHROMIUM_WEBVIEW_C002
          chmod +x run_validation.sh run_core_tests.sh
          ./run_validation.sh | tee /tmp/C002_VALIDATION.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/C002_VALIDATION.txt
          grep -F 'STATIC_RESULT pass=10 fail=0' /tmp/C002_VALIDATION.txt

      - name: Derive U013 SHARED-009 including AUTHFIX2
        shell: bash
        run: |
          set -euo pipefail
          python3 u013ux009/derive.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

      - name: Apply M024 RECONCILE-002
        shell: bash
        run: |
          set -euo pipefail
          python3 reconcile001/apply_reconcile.py "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

      - name: Apply Runtime015 monitor integration
        shell: bash
        run: |
          set -euo pipefail
          python3 reconcile015/provider_runtime_015.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"

      - name: Validate runtime, Golden paths and monitor invariants
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          MAIN="$ROOT/app/src/main/java/nexus/android/c002/MainActivity.kt"
          BRIDGE="$ROOT/app/src/main/java/nexus/android/c002/web/NexusWebBridge.kt"
          GEMINI="$ROOT/app/src/main/assets/nexus/gemini_provider_c002.js"
          MON="$ROOT/app/src/main/assets/nexus/nexus_existing_guest_monitor_patch.js"

          "$ROOT/run_core_tests.sh" | tee /tmp/CORE.txt
          grep -F 'RESULT pass=27 fail=0' /tmp/CORE.txt

          # Runtime014 preservation.
          grep -F 'android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"' "$ROOT/app/src/main/AndroidManifest.xml"
          grep -F 'override fun onConfigurationChanged(newConfig: Configuration)' "$MAIN"
          grep -F 'CONFIGURATION_CHANGED_PRESERVED' "$MAIN"
          grep -F 'postExecutionWhenBridgeReady' "$MAIN"
          grep -F 'fun isReady(origin: String): Boolean' "$BRIDGE"

          for f in chatgpt_provider_c002.js gemini_provider_c002.js claude_provider_c002.js zai_provider_c002.js grok_provider_013.js; do
            node --check "$ROOT/app/src/main/assets/nexus/$f"
            grep -F "type:'BRIDGE_READY'" "$ROOT/app/src/main/assets/nexus/$f"
          done

          # Golden ChatGPT/Gemini + multiprovider transport remains intact.
          test "$(grep -F -c '.put("research_policy", job.researchPolicy.name)' "$MAIN")" -ge 2
          grep -F '.put("external_research", false)' "$MAIN"
          grep -F 'composer && negatives.length===0' "$GEMINI"
          grep -F 'manuallyConfirmed&&!!composerAtDispatch' "$GEMINI"
          grep -F 'SelectedProvider.CLAUDE -> CLAUDE_RUNTIME_CHANNEL' "$MAIN"
          grep -F 'SelectedProvider.GROK -> GROK_CHANNEL' "$MAIN"

          # Exact compact source is embedded and syntactically valid.
          echo 'd3a2f5a9fcaa5e755226c3d04145ddc46e20862e0eaf034f3b8f646babe093aa  reconcile015/nexus_existing_guest_monitor_patch.js' | sha256sum -c -
          node --check "$MON"
          cmp -s "$MON" "$GITHUB_WORKSPACE/reconcile015/nexus_existing_guest_monitor_patch.js"
          grep -F "PATCH_ID='NEXUS_C003_EXISTING_GUEST_MONITOR_DEMO_001'" "$MON"
          grep -F "SURVEILLANCE ACTIVE" "$MON"

          # Native adaptation is present and linked to real runtime events.
          grep -F 'setupExchangeMonitor()' "$MAIN"
          grep -F 'monitorPreparing()' "$MAIN"
          grep -F 'monitorOutbound()' "$MAIN"
          grep -F 'monitorProvider()' "$MAIN"
          grep -F 'monitorReturning()' "$MAIN"
          grep -F 'monitorPass()' "$MAIN"
          grep -F 'monitorFail(reason)' "$MAIN"
          grep -F 'Erreur détectée' "$MAIN"
          grep -F 'PROVIDER_RESULT' "$MAIN"

          grep -F 'versionCode = 68' "$ROOT/app/build.gradle.kts"
          grep -F 'versionName = "0.0.68-v007-m024-u013-provider-runtime015-monitor-integrated"' "$ROOT/app/build.gradle.kts"
          printf 'PROVIDER_RUNTIME_015_STATIC_RESULT pass=30 fail=0\n' | tee /tmp/STATIC015.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Apply NEXUS launcher branding
        uses: mobilexiaoben-byte/nexus-v005-android-c002/branding@main
        with:
          root: ${{ github.workspace }}/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002

      - name: Build APK
        working-directory: work/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK and prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/V005_ANDROID_CHROMIUM_WEBVIEW_C002"
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/BADGING.txt
          grep -F "package: name='nexus.android.v007.m024.u013.providercontract006'" /tmp/BADGING.txt
          grep -F "versionCode='68'" /tmp/BADGING.txt
          grep -F "application-label:'NEXUS'" /tmp/BADGING.txt
          unzip -l "$APK" | grep -F 'assets/nexus/nexus_existing_guest_monitor_patch.js'
          cp "$APK" NEXUS-V007-M024-U013-PROVIDER-RUNTIME-015-MONITOR-INTEGRATED-debug.apk
          sha256sum NEXUS-V007-M024-U013-PROVIDER-RUNTIME-015-MONITOR-INTEGRATED-debug.apk | tee NEXUS-V007-M024-U013-PROVIDER-RUNTIME-015-MONITOR-INTEGRATED-debug.apk.sha256
          cp "$ROOT/RECONCILIATION_LOCK.txt" .

      - name: Upload installable APK directly
        uses: actions/upload-artifact@v7
        with:
          path: NEXUS-V007-M024-U013-PROVIDER-RUNTIME-015-MONITOR-INTEGRATED-debug.apk
          archive: false
          if-no-files-found: error

      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-V007-M024-U013-PROVIDER-RUNTIME-015-MONITOR-INTEGRATED-evidence
          path: |
            NEXUS-V007-M024-U013-PROVIDER-RUNTIME-015-MONITOR-INTEGRATED-debug.apk.sha256
            RECONCILIATION_LOCK.txt
            /tmp/C002_VALIDATION.txt
            /tmp/CORE.txt
            /tmp/STATIC015.txt
            /tmp/BADGING.txt
          if-no-files-found: error
