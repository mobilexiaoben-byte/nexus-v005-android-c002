name: NEXUS V005 BLOCKHOST DIAG V2

on:
  push:
    branches:
      - v005-executionproof006-blockhostdiag
    paths:
      - '.github/workflows/build-executionproof006-blockhostdiag-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Validate frozen C002
        run: |
          set -euo pipefail
          echo '26b5b157b487eda3a0c92198066d39beb5e6eb1149a3c4a705b49274c636eed4  V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip' | sha256sum -c -
          rm -rf base work
          mkdir base
          unzip -q V005_ANDROID_CHROMIUM_WEBVIEW_C002.zip -d base
          cd base/V005_ANDROID_CHROMIUM_WEBVIEW_C002
          chmod +x run_validation.sh run_core_tests.sh
          ./run_validation.sh | tee /tmp/C002_VALIDATION.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/C002_VALIDATION.txt
          grep -F 'STATIC_RESULT pass=10 fail=0' /tmp/C002_VALIDATION.txt

      - name: Derive diagnostic
        run: |
          set -euo pipefail
          cp -a base work
          ROOT='work/V005_ANDROID_CHROMIUM_WEBVIEW_C002'
          cp executionproof006/MainActivity.kt "$ROOT/app/src/main/java/nexus/android/c002/MainActivity.kt"
          cp executionproof006/chatgpt_provider_c002.js "$ROOT/app/src/main/assets/nexus/chatgpt_provider_c002.js"
          python3 blockhostdiag/derive.py "$ROOT"
          test "$(sha256sum "$ROOT/app/src/main/java/nexus/android/c002/web/OriginPolicy.kt" | cut -d' ' -f1)" = '80241cf1581bdac6e87f602d300acebef5785f93e9bb570de4925b99118b76b3'
          sha256sum "$ROOT/app/src/main/java/nexus/android/c002/MainActivity.kt" "$ROOT/app/src/main/assets/nexus/chatgpt_provider_c002.js" "$ROOT/app/src/main/java/nexus/android/c002/web/OriginPolicy.kt" > /tmp/BLOCKHOST_DIAG_SOURCE_SHA256.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Validate derivative
        run: |
          set -euo pipefail
          ROOT='work/V005_ANDROID_CHROMIUM_WEBVIEW_C002'
          cd "$ROOT"
          ./run_core_tests.sh | tee /tmp/BLOCKHOST_CORE.txt
          grep -F 'RESULT pass=25 fail=0' /tmp/BLOCKHOST_CORE.txt
          cd "$GITHUB_WORKSPACE"
          chmod +x blockhostdiag/validate.sh
          blockhostdiag/validate.sh "$ROOT" | tee /tmp/BLOCKHOST_VALIDATION.txt
          grep -F 'BLOCKHOST_DIAG_STATIC_RESULT pass=24 fail=0' /tmp/BLOCKHOST_VALIDATION.txt

      - name: Build APK
        working-directory: work/V005_ANDROID_CHROMIUM_WEBVIEW_C002
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          APK='work/V005_ANDROID_CHROMIUM_WEBVIEW_C002/app/build/outputs/apk/debug/app-debug.apk'
          cp "$APK" NEXUS-V005-C002-EXECUTION-PROOF-006-BLOCKHOST-DIAG-debug.apk
          sha256sum NEXUS-V005-C002-EXECUTION-PROOF-006-BLOCKHOST-DIAG-debug.apk > NEXUS-V005-C002-EXECUTION-PROOF-006-BLOCKHOST-DIAG-debug.apk.sha256
          (cd work && zip -qr ../V005_ANDROID_CHROMIUM_WEBVIEW_C002_EXECUTION_PROOF_006_BLOCKHOST_DIAG.zip V005_ANDROID_CHROMIUM_WEBVIEW_C002)
          cp /tmp/BLOCKHOST_DIAG_SOURCE_SHA256.txt .
          cp /tmp/C002_VALIDATION.txt .
          cp /tmp/BLOCKHOST_CORE.txt .
          cp /tmp/BLOCKHOST_VALIDATION.txt .
          cat NEXUS-V005-C002-EXECUTION-PROOF-006-BLOCKHOST-DIAG-debug.apk.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-EXECUTION-PROOF-006-BLOCKHOST-DIAG-debug
          path: NEXUS-V005-C002-EXECUTION-PROOF-006-BLOCKHOST-DIAG-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-EXECUTION-PROOF-006-BLOCKHOST-DIAG-source
          path: V005_ANDROID_CHROMIUM_WEBVIEW_C002_EXECUTION_PROOF_006_BLOCKHOST_DIAG.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: NEXUS-V005-C002-EXECUTION-PROOF-006-BLOCKHOST-DIAG-evidence
          path: |
            NEXUS-V005-C002-EXECUTION-PROOF-006-BLOCKHOST-DIAG-debug.apk.sha256
            BLOCKHOST_DIAG_SOURCE_SHA256.txt
            C002_VALIDATION.txt
            BLOCKHOST_CORE.txt
            BLOCKHOST_VALIDATION.txt
          if-no-files-found: error
